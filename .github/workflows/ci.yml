name: CI

# 慳 GitHub Actions 分鐘（private repo 每月 2,000 分鐘免費）：
# 只喺 design/** 分支同 PR 跑；main 由 Deploy 自己測試同 build；家規測試喺 rules.yml（改到規則先跑）
on:
  push:
    branches: ['design/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 計分引擎測試
        run: npm test
      - name: 型別檢查
        run: npm run typecheck
      - name: Build
        run: npm run build
