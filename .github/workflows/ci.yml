name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 計分引擎測試
        run: npm test
      - name: 型別檢查
        run: npm run typecheck
      - name: Build
        run: npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4
      - name: 資料庫規則測試（模擬器）
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project jeukbou-rules-test "node --test scripts/rules.test.mjs"
