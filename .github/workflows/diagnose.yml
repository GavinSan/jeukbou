name: Diagnose functions

# 淨係睇（唔部署）：Cloud Functions / Cloud Run 嘅狀態同最近嘅錯誤記錄，查通知發唔到嘅原因
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 睇最近幾多個鐘嘅記錄
        default: '8'
      repair:
        description: 修復：取消「一日就刪映像檔」嘅清理設定，同刪走壞咗嘅 build cache（之後再部署 functions）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 修復映像檔設定
        if: ${{ inputs.repair }}
        run: |
          gcloud config set project jeukbou-app >/dev/null
          for loc in northamerica-northeast2 us-central1; do
            echo "=== $loc"
            gcloud artifacts repositories delete-cleanup-policies gcf-artifacts --location "$loc" --policynames firebase-functions-cleanup --quiet || true
            gcloud artifacts docker images delete "${loc}-docker.pkg.dev/jeukbou-app/gcf-artifacts/cache" --delete-tags --quiet || true
            gcloud artifacts repositories describe gcf-artifacts --location "$loc" --format="yaml(cleanupPolicies)" || true
          done
      - name: Cloud Run 服務狀態
        run: |
          gcloud config set project jeukbou-app >/dev/null
          gcloud run services list --region northamerica-northeast2 \
            --format="table(metadata.name,status.conditions[0].status,status.conditions[0].message.slice(0:120),status.latestReadyRevisionName,status.latestCreatedRevisionName)" || true
          for s in meetupping pullalert; do
            echo "=== $s"
            gcloud run services describe "$s" --region northamerica-northeast2 \
              --format="yaml(status.conditions,status.traffic,spec.template.spec.containers[0].resources,spec.template.metadata.annotations)" || true
            gcloud run services get-iam-policy "$s" --region northamerica-northeast2 || true
          done
      - name: 最近嘅錯誤記錄
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          h=$(printf '%s' "$HOURS" | tr -cd '0-9'); h=${h:-8}
          since=$(date -u -d "-${h} hours" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.location=\"northamerica-northeast2\" AND severity>=WARNING AND timestamp>=\"${since}\"" \
            --project jeukbou-app --limit 80 --order desc \
            --format="value(timestamp,resource.labels.service_name,resource.labels.revision_name,severity,textPayload,jsonPayload.message,protoPayload.status.message)" \
            | grep -v -iE "private_key|sk-ant" | cut -c1-600 || true
          echo "=== 處理請求時嘅錯誤（完整內容）"
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.location=\"northamerica-northeast2\" AND severity>=ERROR AND timestamp>=\"${since}\" AND NOT textPayload:\"Ready condition\" AND NOT protoPayload.status.message:\"Ready condition\"" \
            --project jeukbou-app --limit 15 --order desc --format=json \
            | grep -v -iE "private_key|sk-ant|\"token\"" | cut -c1-400 | head -400 || true
          echo "=== 啟動失敗嘅 revision（meetupping 最新）"
          rev=$(gcloud run services describe meetupping --region northamerica-northeast2 --format="value(status.latestCreatedRevisionName)" 2>/dev/null)
          [ -n "$rev" ] && gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"${rev}\"" \
            --project jeukbou-app --limit 40 --order asc \
            --format="value(timestamp,severity,textPayload,jsonPayload.message)" | grep -v -iE "private_key|sk-ant" | cut -c1-600 || true
      - name: Revision 詳細狀態同系統記錄
        run: |
          for r in $(gcloud run revisions list --service meetupping --region northamerica-northeast2 --format="value(metadata.name)" | head -3); do
            echo "=== revision $r"
            gcloud run revisions describe "$r" --region northamerica-northeast2 \
              --format="yaml(status.conditions,spec.containers[0].image,spec.containers[0].resources,spec.serviceAccountName,metadata.annotations)" | cut -c1-300 || true
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"${r}\"" \
              --project jeukbou-app --limit 25 --order asc --format=json \
              | grep -E '"(textPayload|message|logName|severity|timestamp)"' | grep -v -iE "private_key|sk-ant" | cut -c1-500 || true
          done
          echo "=== Artifact Registry 清理設定"
          gcloud artifacts repositories describe gcf-artifacts --location northamerica-northeast2 --format="yaml(cleanupPolicies,cleanupPolicyDryRun,sizeBytes)" || true
          gcloud artifacts docker images list northamerica-northeast2-docker.pkg.dev/jeukbou-app/gcf-artifacts --include-tags --limit 30 --format="table(package.basename(),tags.list(),createTime)" 2>&1 | tail -30 || true
