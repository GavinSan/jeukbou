name: Deploy

# push 上 main 就自動部署去 Firebase Hosting，同時更新資料庫規則。
# 要先喺 GitHub repo 設定：
#   Variables → FIREBASE_WEB_CONFIG（Firebase 網頁設定，成段 JSON）
#   Secrets   → FIREBASE_SERVICE_ACCOUNT（服務帳戶 JSON；唔好放落 repo 任何地方）
# 推播（可選）：Variables → FIREBASE_VAPID_KEY（Cloud Messaging 網頁推播金鑰）
#               Variables → ENABLE_PUSH = true（轉咗 Blaze 同畀咗服務帳戶權限之後先開，會部署 Cloud Functions）
# 影相計番（可選）：Secrets → ANTHROPIC_API_KEY（Claude Console 嘅 API key）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_push:
        description: 部署完發一個測試通知俾超級管理員（要佢部手機開咗通知）
        type: boolean
        default: false
      show_logs:
        description: 部署完顯示 Cloud Functions 最近嘅錯誤記錄（查通知發唔到）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_WEB_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
      - name: 部署（網站 + 資料庫規則）
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          SHOW_LOGS: ${{ inputs.show_logs }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::搵唔到 FIREBASE_SERVICE_ACCOUNT secret。去 Settings → Secrets and variables → Actions → Secrets 加返，名要一模一樣。"
            exit 1
          fi
          # 超級管理員 email 由 Secret 填入規則（冇設定就冇人係超級管理員）
          if [ -n "$SUPER_ADMIN_EMAIL" ]; then
            ADMIN="$SUPER_ADMIN_EMAIL" node -e "const fs=require('fs');const e=process.env.ADMIN.replace(/[^A-Za-z0-9._%+@-]/g,'');fs.writeFileSync('firestore.rules',fs.readFileSync('firestore.rules','utf8').replace('__SUPER_ADMIN_EMAIL__',e))"
            echo "::notice::已設定超級管理員"
          else
            echo "::warning::未設定 SUPER_ADMIN_EMAIL secret，暫時冇超級管理員"
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # 顯示用緊邊個服務帳戶（只係 email，唔會顯示金鑰）
          sa_email=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).client_email||'(冇 client_email)')}catch(e){console.log('(JSON 格式唔啱)')}" "$RUNNER_TEMP/sa.json")
          echo "::notice::部署用緊服務帳戶：${sa_email}"
          set +e
          fail=0
          targets="hosting firestore:rules"
          # 推播：開咗 ENABLE_PUSH 先部署 Cloud Functions（要 Blaze 計劃）；地區跟 Firestore 資料庫
          if [ "$ENABLE_PUSH" = "true" ]; then
            npm install --prefix functions --no-audit --no-fund --omit=dev
            loc=$(npx --yes firebase-tools@13 firestore:databases:get "(default)" --project jeukbou-app --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log((j.result||j).locationId||'')}catch{console.log('')}})")
            case "$loc" in
              nam5|"") region=us-central1 ;;
              eur3) region=europe-west1 ;;
              *) region="$loc" ;;
            esac
            # Functions 嘅設定（唔入 repo）：地區、超級管理員（影相計番權限）、Claude API key
            umask 077
            {
              printf 'PUSH_REGION=%s\n' "$region"
              [ -n "$SUPER_ADMIN_EMAIL" ] && printf 'SUPER_ADMIN_EMAIL=%s\n' "$(printf '%s' "$SUPER_ADMIN_EMAIL" | tr -cd 'A-Za-z0-9._%+@-')"
              [ -n "$ANTHROPIC_API_KEY" ] && printf 'ANTHROPIC_API_KEY=%s\n' "$(printf '%s' "$ANTHROPIC_API_KEY" | tr -cd 'A-Za-z0-9_-')"
            } > functions/.env
            [ -n "$ANTHROPIC_API_KEY" ] && echo "::notice title=functions::已設定 Claude API key（影相計番）" || echo "::notice title=functions::未設定 ANTHROPIC_API_KEY，影相計番用唔到"
            echo "::notice title=functions::Firestore 位置 ${loc:-未知}，Functions 地區 ${region}"
            targets="$targets functions"
          else
            echo "::notice title=functions::未開 ENABLE_PUSH，唔部署推播"
          fi
          # 每樣分開部署，一樣失敗唔會拖累另一樣
          for target in $targets; do
            extra=""
            [ "$target" = "functions" ] && extra="--force"
            npx --yes firebase-tools@13 deploy --only "$target" --project jeukbou-app --non-interactive $extra 2>&1 | tee "$RUNNER_TEMP/deploy.log"
            st=${PIPESTATUS[0]}
            # 之前建立失敗嘅 function 會留低一個空殼（當咗係 HTTPS），之後就改唔到做 Firestore 觸發：
            # 淨係刪走報錯嗰個，再部署一次（firebase 每次只報第一個，所以最多重複 5 次）
            if [ "$target" = "functions" ]; then
              for pass in 1 2 3 4 5; do
                broken=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" | grep -oE '\[[A-Za-z0-9_-]+\([a-z0-9-]+\)\] Changing from an HTTPS function to a background triggered function' | sed -E 's/^\[([A-Za-z0-9_-]+)\(([a-z0-9-]+)\)\].*/\1 \2/' | sort -u)
                [ -z "$broken" ] && break
                while read -r fn rg; do
                  echo "::warning title=functions::刪走建立失敗嘅 ${fn}（${rg}）再重新部署"
                  npx --yes firebase-tools@13 functions:delete "$fn" --region "$rg" --project jeukbou-app --force --non-interactive || true
                done <<< "$broken"
                npx --yes firebase-tools@13 deploy --only "$target" --project jeukbou-app --non-interactive $extra 2>&1 | tee "$RUNNER_TEMP/deploy.log"
                st=${PIPESTATUS[0]}
              done
            fi
            # 有時 functions 部分失敗都會 exit 0：見到「failed to create/update function」都當失敗
            if [ "$st" -eq 0 ] && grep -qiE "failed to (create|update|delete) function|Functions deploy had errors" "$RUNNER_TEMP/deploy.log"; then st=1; fi
            if [ "$st" -ne 0 ]; then
              fail=1
              # 出錯：顯示最尾幾行有用嘅訊息（唔顯示金鑰）
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" | grep -v -iE "private_key|BEGIN|sk-ant|ensuring required API|required API .* is enabled" \
                | grep -iE "error|denied|permission|not found|not been used|billing|403|404|gcloud|iam|failed|http" | tail -10 \
                | while IFS= read -r line; do echo "::error title=${target}::${line}"; done
            else
              echo "::notice title=${target}::部署成功"
              # 舊嘅 function 映像檔：Artifact Registry 自動清走一日前嘅（唔使人手去刪）
              if [ "$target" = "functions" ]; then
                for loc in northamerica-northeast2 us-central1; do
                  npx --yes firebase-tools@13 functions:artifacts:setpolicy --location "$loc" --days 1 --force --project jeukbou-app --non-interactive >/dev/null 2>&1 \
                    && echo "::notice title=functions::${loc} 舊映像檔會自動清走（保留 1 日）" \
                    || echo "::warning title=functions::${loc} 設定唔到自動清走舊映像檔"
                done
              fi
            fi
          done
          # 手動跑 Deploy 揀咗 test_push：發一個測試通知俾超級管理員
          if [ "$TEST_PUSH" = "true" ]; then
            [ -d functions/node_modules ] || npm install --prefix functions --no-audit --no-fund --omit=dev >/dev/null
            node scripts/push-admin.mjs || echo "::warning title=test push::發唔到測試通知"
          fi
          # 手動跑 Deploy 揀咗 show_logs：顯示 functions 最近嘅錯誤（唔顯示金鑰）
          if [ "$SHOW_LOGS" = "true" ]; then
            npx --yes firebase-tools@13 functions:log --project jeukbou-app -n 200 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' | grep -v -iE "private_key|sk-ant" \
              | grep -iE " E |error|denied|unauthenticated|forbidden|failed" | tail -40 || true
          fi
          rm -f "$RUNNER_TEMP/sa.json"
          exit "$fail"
