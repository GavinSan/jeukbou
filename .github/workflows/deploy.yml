name: Deploy

# push 上 main 就自動部署去 Firebase Hosting，同時更新資料庫規則。
# 要先喺 GitHub repo 設定：
#   Variables → FIREBASE_WEB_CONFIG（Firebase 網頁設定，成段 JSON）
#   Secrets   → FIREBASE_SERVICE_ACCOUNT（服務帳戶 JSON；唔好放落 repo 任何地方）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_WEB_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
      - name: 部署（網站 + 資料庫規則）
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::搵唔到 FIREBASE_SERVICE_ACCOUNT secret。去 Settings → Secrets and variables → Actions → Secrets 加返，名要一模一樣。"
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # 顯示用緊邊個服務帳戶（只係 email，唔會顯示金鑰）
          sa_email=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).client_email||'(冇 client_email)')}catch(e){console.log('(JSON 格式唔啱)')}" "$RUNNER_TEMP/sa.json")
          echo "::notice::部署用緊服務帳戶：${sa_email}"
          set +e
          fail=0
          # 網站同資料庫規則分開部署，一樣失敗唔會拖累另一樣
          for target in hosting firestore:rules; do
            npx --yes firebase-tools@13 deploy --only "$target" --project jeukbou-app --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              fail=1
              grep -iE "error|denied|permission|not found|not been used|enable|billing|403|404" "$RUNNER_TEMP/deploy.log" \
                | grep -v -iE "private_key|BEGIN" | sed 's/\x1b\[[0-9;]*m//g' | sort -u | head -6 \
                | while IFS= read -r line; do echo "::error title=${target}::${line}"; done
            else
              echo "::notice title=${target}::部署成功"
            fi
          done
          rm -f "$RUNNER_TEMP/sa.json"
          exit "$fail"
