name: Rules

# 資料庫規則測試（模擬器）：淨係改到規則或者規則測試先跑，慳分鐘
on:
  push:
    branches: ['design/**']
    paths:
      - firestore.rules
      - scripts/rules.test.mjs
      - .github/workflows/rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4
      - name: 資料庫規則測試（模擬器）
        run: |
          set +e
          npx --yes firebase-tools@13 emulators:exec --only firestore --project jeukbou-rules-test "node --test --test-reporter=tap scripts/rules.test.mjs > rules.tap"
          code=$?
          echo "::notice title=rules::$(grep -E '^# (tests|pass|fail) ' rules.tap | tr '\n' ' ')"
          grep -E '^not ok' rules.tap | sed 's/^/::error title=rules::/'
          exit $code
